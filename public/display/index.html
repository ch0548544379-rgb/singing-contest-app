<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תחרות השירה - מסך קהל</title>
<link rel="stylesheet" href="/shared/theme.css">
<link rel="stylesheet" href="display.css">
</head>
<body>
  <div class="stage-bg" id="stageBg"></div>
  <canvas id="notes-canvas"></canvas>
  <div id="silhouette-layer"></div>
  <div id="stingFlash" class="sting-flash"></div>

  <div class="content" id="app">
    <div id="soundGate" class="sound-gate">
      <button id="soundBtn">🔊 הפעלת מסך התחרות</button>
    </div>

    <!-- מצב: ריק / פתיחה -->
    <section id="screen-idle" class="screen">
      <h1 class="glow-text title-huge">תחרות הזמר</h1>
      <p class="subtitle">התחרות עומדת להתחיל...</p>
    </section>

    <!-- מצב: זמר על הבמה -->
    <section id="screen-performer" class="screen hidden">
      <div class="stage-badge" id="stageBadge">שלב 1</div>
      <p class="now-singing">עכשיו שר</p>
      <h1 class="glow-text performer-name" id="performerName">-</h1>
      <div class="judges-live hidden" id="judgesLivePerformer">ניקוד שופטים: <span></span></div>
    </section>

    <!-- מצב: הצבעה פתוחה -->
    <section id="screen-voting" class="screen hidden">
      <div class="stage-badge" id="stageBadgeV">שלב 1</div>
      <p class="now-singing">מצביעים עכשיו עבור</p>
      <h2 class="glow-text performer-name-sm" id="votingName">-</h2>
      <div class="judges-live hidden" id="judgesLiveVoting">ניקוד שופטים: <span></span></div>
      <div class="vote-histogram" id="histogram"></div>
      <div class="vote-stats" id="voteStatsBox">
        <div class="stat"><span class="stat-num" id="voteCount">0</span><span class="stat-label">מצביעים</span></div>
        <div class="stat"><span class="stat-num" id="voteAvg">0.0</span><span class="stat-label">ממוצע</span></div>
      </div>
      <div class="points-gauge-wrap" id="pointsGaugeWrap">
        <div class="points-gauge"><div class="points-gauge-fill" id="pointsGaugeFill"></div></div>
        <div class="points-label">נקודות קהל: <span id="audiencePoints">0.0</span> / <span id="audiencePointsMax">0</span></div>
      </div>
      <p class="call-cta" id="callCta">🔥 הצביעו עכשיו והשפיעו! 🔥</p>
      <p class="vote-phone hidden" id="votePhoneDisplay"></p>
    </section>

    <!-- מצב: תוצאות סבב -->
    <section id="screen-results" class="screen hidden">
      <div id="resultsSpotlight" class="results-spotlight hidden">
        <div class="spotlight-rank glow-text" id="spotlightRank">מקום ראשון</div>
        <div class="spotlight-name" id="spotlightName">-</div>
        <div class="spotlight-score" id="spotlightScore">0.0</div>
      </div>
      <h2 class="glow-text results-title hidden" id="resultsTitle">תוצאות</h2>
      <div class="results-list hidden" id="resultsList"></div>
    </section>

    <!-- מצב: בחירת שיר -->
    <section id="screen-song" class="screen hidden">
      <h2 class="glow-text">הקהל בוחר את השיר!</h2>
      <div class="song-list" id="songList"></div>
    </section>

    <!-- מצב: זוכה -->
    <section id="screen-winner" class="screen hidden">
      <p class="winner-label">והזוכה הוא...</p>
      <div class="carpet-track" id="carpetTrack"><div class="carpet-strip"></div></div>
      <h1 class="winner-name gold-cast hidden" id="winnerName">-</h1>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/shared/effects.js"></script>
  <script src="/shared/audio.js"></script>
  <script src="display.js"></script>
</body>
</html>
